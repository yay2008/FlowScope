<div id="crypto-strength-replay">
  <h2>ZEC / ENA · 大单显示强弱回放</h2>
  <div class="viz-controls">
    <label class="form-label">共同回放时段<select id="strength-window" class="form-select"></select></label>
  </div>
  <div class="strength-legend">
    <button type="button" class="strength-key cursor-interaction" data-layer="large" aria-pressed="true"><span class="strength-dot strength-filled" aria-hidden="true"></span>原大单 · 强亮弱淡</button>
    <button type="button" class="strength-key cursor-interaction" data-layer="relative" aria-pressed="true"><span class="strength-dot strength-hollow" aria-hidden="true"></span>相对异常 · 空心</button>
    <span>下方 ＋ 主动买 · 上方 − 主动卖</span>
  </div>
  <div id="strength-range" class="text-small tabular-nums" aria-live="polite"></div>
  <div class="strength-pair">
    <section><h3>ZEC · 全部突出</h3><div id="strength-zec-before-count" class="text-small tabular-nums"></div><div id="strength-zec-before"></div></section>
    <section><h3>ZEC · 按强弱显示</h3><div id="strength-zec-after-count" class="text-small tabular-nums"></div><div id="strength-zec-after"></div></section>
  </div>
  <div id="strength-zec-total" class="text-small tabular-nums strength-total"></div>
  <div class="strength-pair">
    <section><h3>ENA · 全部突出</h3><div id="strength-ena-before-count" class="text-small tabular-nums"></div><div id="strength-ena-before"></div></section>
    <section><h3>ENA · 按强弱显示</h3><div id="strength-ena-after-count" class="text-small tabular-nums"></div><div id="strength-ena-after"></div></section>
  </div>
  <div id="strength-ena-total" class="text-small tabular-nums strength-total"></div>
  <div class="viz-row strength-playback">
    <button id="strength-prev" class="btn" type="button">前一根</button>
    <button id="strength-play" class="btn btn-primary" type="button">从头播放</button>
    <button id="strength-next" class="btn" type="button">后一根</button>
    <span id="strength-step-label" class="tabular-nums"></span>
  </div>
  <label class="form-label strength-scrubber">30 秒收盘逐根回放<input id="strength-step" class="form-range" type="range" min="1" max="60" step="1" value="60"></label>
  <div id="strength-detail" class="text-small strength-detail" aria-live="polite"></div>
  <details id="strength-statistics">
    <summary class="cursor-interaction">完整统计 · 已回放区间（含所有淡化点）</summary>
    <div id="strength-statistics-range" class="text-small"></div>
    <table class="table table-sm tabular-nums"><thead><tr><th>统计项</th><th class="text-end">ZEC</th><th class="text-end">ENA</th></tr></thead><tbody id="strength-statistics-body"></tbody></table>
  </details>
  <div class="text-small text-muted strength-method">Binance + OKX 成交汇总 · Binance 价格 K 线。显示基准：过去 60 分钟同侧非零大单累计量；前 20% 突出，其余渐淡。P99、金额线、数量半径及统计均保留。</div>
  <div id="strength-tooltip" class="tooltip" role="tooltip" hidden></div>
  <script id="strength-data" type="application/json">__PREVIEW_DATA__</script>
</div>
<style>
#crypto-strength-replay{position:relative;min-width:0}
#crypto-strength-replay h2{padding-right:96px}
#crypto-strength-replay .strength-legend{display:flex;align-items:center;gap:12px 18px;flex-wrap:wrap;margin:12px 0 8px}
#crypto-strength-replay .strength-key{display:inline-flex;gap:7px;align-items:center;background:transparent;border:0;padding:0;color:var(--foreground);font:inherit}
#crypto-strength-replay .strength-key[aria-pressed="false"]{opacity:.4}
#crypto-strength-replay .strength-dot{display:inline-block;width:11px;height:11px;border:1.8px solid var(--foreground);border-radius:50%;box-sizing:border-box}
#crypto-strength-replay .strength-filled{background:color-mix(in srgb,var(--foreground) 55%,transparent)}
#crypto-strength-replay .strength-hollow{background:transparent;border-width:1.2px;opacity:.42}
#crypto-strength-replay .strength-pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:10px}
#crypto-strength-replay .strength-pair section{min-width:0}
#crypto-strength-replay .strength-pair h3{margin:4px 0}
#crypto-strength-replay .strength-svg{display:block;max-width:100%;overflow:visible}
#crypto-strength-replay .strength-svg text{font-size:12px;fill:var(--foreground);font-family:inherit}
#crypto-strength-replay .strength-total{margin:4px 0 12px;overflow-wrap:anywhere}
#crypto-strength-replay .strength-playback{margin-top:14px}
#crypto-strength-replay .strength-scrubber{display:block;margin-top:8px}
#crypto-strength-replay .strength-detail{min-height:2.5em;margin:6px 0;overflow-wrap:anywhere}
#crypto-strength-replay .strength-method{margin-top:10px}
#crypto-strength-replay #strength-tooltip{position:absolute;pointer-events:none;z-index:5;background:var(--popover);color:var(--popover-foreground);padding:8px 10px;max-width:calc(100% - 20px);box-sizing:border-box}
#crypto-strength-replay #strength-tooltip[hidden]{display:none}
@media(max-width:760px){#crypto-strength-replay .strength-pair{grid-template-columns:minmax(0,1fr)}}
</style>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>__LIVE_RENDERER__</script>
<script>
(() => {
  const root=document.getElementById('crypto-strength-replay');
  const q=id=>root.querySelector('#'+id);
  const data=JSON.parse(q('strength-data').textContent),coins=['ZEC','ENA'],modes=['before','after'];
  const windowSelect=q('strength-window'),stepInput=q('strength-step'),tooltip=q('strength-tooltip'),detail=q('strength-detail');
  const buttons={large:root.querySelector('[data-layer="large"]'),relative:root.querySelector('[data-layer="relative"]')};
  const charts={},previousMarks=new Map(),lastModels=new Map();
  for(const coin of coins)for(const mode of modes)charts[coin+'-'+mode]=q('strength-'+coin.toLowerCase()+'-'+mode);
  const num=(v,digits=2)=>Number(v).toLocaleString('zh-CN',{maximumFractionDigits:digits});
  const time=(ms,seconds=false)=>new Date(ms).toLocaleTimeString('zh-CN',{timeZone:'Asia/Shanghai',hour12:false,hour:'2-digit',minute:'2-digit',...(seconds?{second:'2-digit'}:{})});
  const capacityForWidth=width=>Math.min(30,Math.max(8,Math.floor((width-124)/13)));
  let state={sample:0,step:60,large:true,relative:true,statistics:false},timer=null;
  for(const [i,w] of data.windows.entries()){
    const option=document.createElement('option');option.value=String(i);
    option.textContent=w.date+'—'+time(w.start_ms+1800000)+' · '+w.label;windowSelect.append(option);
  }

  function markStyle(tier,rank,mode){
    if(tier==='relative')return {fillOpacity:0,strokeOpacity:.42,strokeWidth:1.2,symbolOpacity:0,highlighted:false};
    const highlighted=mode==='before'||rank===null||rank>=data.rule.highlight_rank;
    if(highlighted)return {fillOpacity:.58,strokeOpacity:.95,strokeWidth:1.8,symbolOpacity:1,highlighted:true};
    const level=Math.min(1,Math.max(0,rank/data.rule.highlight_rank))**2;
    return {fillOpacity:.045+.155*level,strokeOpacity:.12+.28*level,strokeWidth:1,symbolOpacity:.18+.22*level,highlighted:false};
  }

  function buildChart(w,step,width,mode='after',showLarge=true,showRelative=true,sharedCapacity=null){
    width=Math.max(300,Math.round(width));
    const height=360,frame={left:72,right:width-10,top:28,bottom:310};
    const capacity=sharedCapacity??capacityForWidth(width),end=Math.max(1,Math.min(60,step)),begin=Math.max(0,end-capacity);
    const rows=w.rows.slice(begin,end),unit=w.unit[end-1];
    const total={large:{events:0,markers:0,highlighted:0,buyQty:0,sellQty:0,notional:0},relative:{events:0,markers:0,buyQty:0,sellQty:0,notional:0}};
    let maxRadius=3,upperPad=14,lowerPad=14;
    const geometry=rows.map((row,i)=>{
      const points=[];
      for(const side of [0,1]){
        const rLarge=row[8+side]?FlowLargeTrades.radius(row[4+side],unit):0;
        const rRelative=row[10+side]?FlowLargeTrades.radius(row[6+side],unit):0;
        const offsets={large:rLarge+6,relative:rLarge?2*rLarge+11+rRelative:rRelative+6};
        const extent=Math.max(rLarge?offsets.large+rLarge:0,rRelative?offsets.relative+rRelative:0)+8;
        if(side===0)upperPad=Math.max(upperPad,extent);else lowerPad=Math.max(lowerPad,extent);
        maxRadius=Math.max(maxRadius,rLarge,rRelative);
        for(const [tier,k,r] of [['large',0,rLarge],['relative',2,rRelative]]){
          const count=row[8+k+side],qty=row[4+k+side],notional=row[12+k+side];
          total[tier].events+=count;total[tier][side?'buyQty':'sellQty']+=qty;total[tier].notional+=notional;
          if(!count)continue;
          total[tier].markers++;
          const rank=tier==='large'?w.ranks[begin+i][side]:null,style=markStyle(tier,rank,mode);
          if(tier==='large'&&style.highlighted)total.large.highlighted++;
          points.push({tier,side,r,offset:offsets[tier],barIndex:begin+i,qty,notional,count,rank,
            historySamples:tier==='large'?w.history_samples[begin+i][side]:null,style});
        }
      }
      return points;
    });
    const [lo,hi]=d3.extent(rows.flatMap(row=>[row[1],row[2]])),span=Math.max(hi-lo,hi*1e-5);
    const usable=frame.bottom-frame.top-upperPad-lowerPad,domain=[lo-span*lowerPad/usable,hi+span*upperPad/usable];
    if(hi===lo){domain[0]-=span*.5;domain[1]+=span*.5;}
    const y=d3.scaleLinear().domain(domain).range([frame.bottom,frame.top]);
    const x=d3.scaleLinear().domain([-.5,rows.length-.5]).range([frame.left+maxRadius+3,frame.right-maxRadius-3]);
    const stepWidth=(frame.right-frame.left-maxRadius*2-6)/rows.length,candleWidth=Math.max(2,Math.min(8,stepWidth*.42));
    const digits=hi>=1000?0:hi>=1?2:5;
    let grid='',candles='',dots='',axes='';
    for(const value of y.ticks(4)){
      const cy=y(value);
      grid+=`<line x1="${frame.left}" x2="${frame.right}" y1="${cy}" y2="${cy}" stroke="var(--border)" stroke-opacity=".6"/>`;
      axes+=`<text x="${frame.left-8}" y="${cy+4}" text-anchor="end" data-axis-tick="y">${num(value,digits)}</text>`;
    }
    const tickCount=width<430?3:Math.min(4,rows.length);
    const tickIndices=[...new Set(Array.from({length:tickCount},(_,i)=>Math.round(i*(rows.length-1)/Math.max(1,tickCount-1))))];
    for(const i of tickIndices)axes+=`<text x="${x(i)}" y="${frame.bottom+22}" text-anchor="middle" data-axis-tick="x">${time(w.start_ms+(begin+i)*30000)}</text>`;
    const marks=[];
    rows.forEach((row,i)=>{
      const cx=x(i),color=row[3]>=row[0]?'var(--green)':'var(--red)';
      candles+=`<line x1="${cx}" x2="${cx}" y1="${y(row[1])}" y2="${y(row[2])}" stroke="${color}" stroke-opacity=".45"/><rect x="${cx-candleWidth/2}" y="${Math.min(y(row[0]),y(row[3]))}" width="${candleWidth}" height="${Math.max(1,Math.abs(y(row[0])-y(row[3])))}" fill="${color}" fill-opacity=".3"/>`;
      for(const mark of geometry[i]){
        if((mark.tier==='large'&&!showLarge)||(mark.tier==='relative'&&!showRelative))continue;
        mark.x=cx;mark.y=y(mark.side?row[2]:row[1])+(mark.side?1:-1)*mark.offset;
        mark.ms=w.start_ms+mark.barIndex*30000;mark.key=mark.ms+'-'+mark.tier+'-'+mark.side;
        marks.push(mark);
        const c=mark.side?'var(--green)':'var(--red)',s=mark.style,large=mark.tier==='large';
        dots+=`<g data-mark-key="${mark.key}"><circle data-tier="${mark.tier}" data-side="${mark.side}" data-highlighted="${s.highlighted}" cx="${mark.x}" cy="${mark.y}" r="${mark.r}" fill="${large?c:'none'}" fill-opacity="${s.fillOpacity}" stroke="${c}" stroke-width="${s.strokeWidth}" stroke-opacity="${s.strokeOpacity}"/>`;
        if(large){const a=Math.min(3.5,mark.r*.5);dots+=`<path d="M${mark.x-a},${mark.y}h${a*2}${mark.side?`M${mark.x},${mark.y-a}v${a*2}`:''}" fill="none" stroke="${c}" stroke-width="1.2" stroke-opacity="${s.symbolOpacity}"/>`;}
        dots+='</g>';
      }
    });
    const svg=`<svg class="strength-svg" viewBox="0 0 ${width} ${height}" width="${width}" height="${height}" role="img" aria-label="${mode==='before'?'所有原大单突出':'大单按历史同侧累计量强弱调整亮度'}；30秒真实K线。主动买在下、主动卖在上。"><title>${mode==='before'?'全部突出':'按相对强弱显示'}；半径与统计保持不变</title><desc>显示${rows.length}根已完成K线；${total.large.markers}个原大单点，其中${total.large.highlighted}个突出；${total.relative.markers}个相对异常空心点。</desc><rect data-chart-frame="" x="${frame.left}" y="${frame.top}" width="${frame.right-frame.left}" height="${frame.bottom-frame.top}" fill="none" stroke="var(--border)"/>${grid}${candles}${dots}${axes}<text class="axis-title" data-axis="y" x="${frame.left}" y="16">价格（USDT）</text><text class="axis-title" data-axis="x" x="${(frame.left+frame.right)/2}" y="351" text-anchor="middle">北京时间 · 30秒K线</text><rect data-chart-hit="" x="${frame.left}" y="${frame.top}" width="${frame.right-frame.left}" height="${frame.bottom-frame.top}" fill="transparent"/></svg>`;
    return {svg,marks,total,frame,width,height,begin,end,rows,unit,domain};
  }

  function selectedWindow(){return data.windows[state.sample];}
  function updatePlayback(){q('strength-play').textContent=timer!==null?'暂停':state.step===60?'从头播放':'播放';q('strength-prev').disabled=state.step<=1;q('strength-next').disabled=state.step>=60;}
  function stop(){if(timer!==null){clearInterval(timer);timer=null;}updatePlayback();}
  function save(){
    const w=selectedWindow();window.openai?.setWidgetState?.({privateContent:{...state},modelContent:{
      preview:'crypto-bar-side-strength',coins,window:w.label,time_beijing:w.date,step:state.step,
      large_visible:state.large,relative_visible:state.relative,history_minutes:60,highlight_top_percent:20,live_parameters_changed:false,
    }})?.catch(()=>{});
  }
  function detailFor(mark,coin){
    const layer=mark.tier==='large'?'原大单':'相对异常',side=mark.side?'主动买':'主动卖';
    const strength=mark.tier==='large'?(mark.rank===null?' · 历史样本不足':` · 历史分位 ${num(mark.rank*100,1)}%（${mark.historySamples} 个同侧非零样本）`):'';
    return `${coin} ${time(mark.ms,true)} · ${side} · ${layer} ${num(mark.qty,5)} 币 · ${mark.count} 次 · ${num(mark.notional,0)} USDT${strength}`;
  }
  function hideTooltip(){tooltip.hidden=true;}
  function attachInspection(chart,model,coin,key){
    const svg=chart.querySelector('svg'),hit=svg.querySelector('[data-chart-hit]');
    function inspect(event,pin){
      const box=svg.getBoundingClientRect(),px=event.clientX-box.left,py=event.clientY-box.top;
      let nearest=null,distance=Infinity;
      for(const mark of model.marks){const d=Math.hypot(mark.x-px,mark.y-py);if(d<Math.max(mark.r+6,event.pointerType==='touch'?22:20)&&d<distance){nearest=mark;distance=d;}}
      if(!nearest){hideTooltip();return;}
      tooltip.textContent=detailFor(nearest,coin);tooltip.hidden=false;
      const rb=root.getBoundingClientRect(),tb=tooltip.getBoundingClientRect();
      tooltip.style.left=Math.max(8,Math.min(event.clientX-rb.left+12,rb.width-tb.width-8))+'px';
      tooltip.style.top=Math.max(0,event.clientY-rb.top-tb.height-12)+'px';
      if(pin)detail.textContent=tooltip.textContent;
    }
    hit.addEventListener('pointermove',event=>inspect(event,false));hit.addEventListener('pointerleave',hideTooltip);hit.addEventListener('click',event=>inspect(event,true));
    const previous=previousMarks.get(key),reduced=window.matchMedia?.('(prefers-reduced-motion: reduce)').matches;
    if(previous&&!reduced)for(const group of svg.querySelectorAll('[data-mark-key]')){
      const mark=model.marks.find(m=>m.key===group.getAttribute('data-mark-key')),old=previous.get(mark?.key);
      if(old&&group.animate&&(old.x!==mark.x||old.y!==mark.y||old.r!==mark.r)){
        group.style.transformOrigin=`${mark.x}px ${mark.y}px`;
        group.animate([{transform:`translate(${old.x-mark.x}px,${old.y-mark.y}px) scale(${old.r/mark.r})`},{transform:'translate(0,0) scale(1)'}],{duration:180,easing:'ease-out'});
      }
    }
    previousMarks.set(key,new Map(model.marks.map(m=>[m.key,m])));
    // Check actual label boxes after layout; remove optional ticks if fonts collide.
    const occupied=[];
    const labels=[...svg.querySelectorAll('.axis-title'),...svg.querySelectorAll('[data-axis-tick="y"]'),...svg.querySelectorAll('[data-axis-tick="x"]')];
    for(const label of labels){
      const b=label.getBBox(),overlap=occupied.some(a=>b.x<a.x+a.width+4&&b.x+b.width+4>a.x&&b.y<a.y+a.height+4&&b.y+b.height+4>a.y);
      if(overlap&&label.getAttribute('data-axis-tick'))label.remove();else occupied.push(b);
    }
  }
  function statistics(w){
    const totals={};
    for(const coin of coins){
      const sum=Array(15).fill(0);
      for(const [i,row] of w.coins[coin].rows.slice(0,state.step).entries()){
        row.slice(4).forEach((v,k)=>sum[k]+=v);
        for(const side of [0,1]){
          if(row[8+side]){sum[12]++;if(markStyle('large',w.coins[coin].ranks[i][side],'after').highlighted)sum[13]++;}
          if(row[10+side])sum[14]++;
        }
      }
      totals[coin]=sum;
    }
    const fields=[
      ['原大单 · 全部点数',s=>s[12],0],['新预览 · 突出点数',s=>s[13],0],
      ['原大单 · 次数',s=>s[4]+s[5],0],['原大单 · 主动买量（币）',s=>s[1],3],['原大单 · 主动卖量（币）',s=>s[0],3],
      ['原大单 · 净量（币）',s=>s[1]-s[0],3],['原大单 · 金额（USDT）',s=>s[8]+s[9],0],
      ['相对异常 · 全部点数',s=>s[14],0],['相对异常 · 次数',s=>s[6]+s[7],0],['相对异常 · 主动买量（币）',s=>s[3],3],['相对异常 · 主动卖量（币）',s=>s[2],3],
      ['相对异常 · 净量（币）',s=>s[3]-s[2],3],['相对异常 · 金额（USDT）',s=>s[10]+s[11],0],
    ];
    q('strength-statistics-body').innerHTML=fields.map(([name,fn,digits])=>`<tr><th>${name}</th>${coins.map(coin=>`<td class="text-end">${num(fn(totals[coin]),digits)}</td>`).join('')}</tr>`).join('');
    q('strength-statistics-range').textContent=`${w.date}—${time(w.start_ms+state.step*30000)} · 两种显示共用同一份统计`;
    return totals;
  }
  function draw(){
    if(typeof d3==='undefined'){detail.textContent='图形依赖未加载，请重新打开预览。';return;}
    const w=selectedWindow(),widths=Object.fromEntries(Object.entries(charts).map(([key,chart])=>[key,chart.getBoundingClientRect().width||500]));
    const capacity=capacityForWidth(Math.min(...Object.values(widths)));hideTooltip();
    for(const coin of coins)for(const mode of modes){
      const key=coin+'-'+mode,model=buildChart(w.coins[coin],state.step,widths[key],mode,state.large,state.relative,capacity);
      charts[key].innerHTML=model.svg;lastModels.set(key,model);
      q('strength-'+coin.toLowerCase()+'-'+mode+'-count').textContent=`突出 ${model.total.large.highlighted} / 大单 ${model.total.large.markers} 点${state.large?'':' · 已隐藏'}`;
      attachInspection(charts[key],model,coin,key);
    }
    const base=lastModels.get('ZEC-after');
    q('strength-range').textContent=`${w.date.slice(0,5)} ${time(w.start_ms+base.begin*30000,true)}—${time(w.start_ms+base.end*30000,true)} · 北京时间 · 四图同步 ${base.rows.length} 根`;
    for(const coin of coins){
      const total=lastModels.get(coin+'-after').total;
      q('strength-'+coin.toLowerCase()+'-total').textContent=`${coin} 当前视窗：大单 ${total.large.events} 次 · 买 ${num(total.large.buyQty,3)} / 卖 ${num(total.large.sellQty,3)} 币 · 相对异常 ${total.relative.events} 次 / ${total.relative.markers} 空心点 · 两种显示统计相同`;
    }
    for(const tier of ['large','relative'])buttons[tier].setAttribute('aria-pressed',String(state[tier]));
    q('strength-step-label').textContent=`${state.step} / 60 根`;stepInput.value=String(state.step);windowSelect.value=String(state.sample);
    q('strength-statistics').open=state.statistics;statistics(w);updatePlayback();
    const last=coins.flatMap(coin=>lastModels.get(coin+'-after').marks.filter(m=>m.tier==='large'&&m.barIndex===state.step-1).map(m=>`${coin} ${m.side?'买':'卖'} ${num(m.qty,3)}币${m.style.highlighted?' · 突出':' · 淡化'}`));
    detail.textContent=last.length?last.join('；'):'本根没有所选的原大单标记';
  }
  function changeStep(value){stop();state.step=Math.max(1,Math.min(60,value));draw();save();}
  windowSelect.addEventListener('change',()=>{stop();state.sample=Number(windowSelect.value);state.step=60;previousMarks.clear();draw();save();});
  stepInput.addEventListener('input',()=>{stop();state.step=Number(stepInput.value);draw();});stepInput.addEventListener('change',save);
  q('strength-prev').addEventListener('click',()=>changeStep(state.step-1));q('strength-next').addEventListener('click',()=>changeStep(state.step+1));
  q('strength-play').addEventListener('click',()=>{
    if(timer!==null){stop();save();return;}if(state.step>=60){state.step=1;previousMarks.clear();draw();}
    timer=setInterval(()=>{state.step++;draw();if(state.step>=60){stop();save();}},700);updatePlayback();save();
  });
  for(const tier of ['large','relative'])buttons[tier].addEventListener('click',()=>{state[tier]=!state[tier];draw();save();});
  q('strength-statistics').addEventListener('toggle',()=>{const value=q('strength-statistics').open;if(value!==state.statistics){state.statistics=value;save();}});
  function applySaved(saved){
    const value=saved?.privateContent;if(!value||saved?.modelContent?.preview!=='crypto-bar-side-strength')return;
    stop();state={sample:Number.isInteger(value.sample)&&value.sample>=0&&value.sample<data.windows.length?value.sample:0,
      step:Math.max(1,Math.min(60,Math.round(Number(value.step)||60))),large:value.large!==false,relative:value.relative!==false,statistics:!!value.statistics};
    previousMarks.clear();
  }
  applySaved(window.openai?.widgetState);draw();
  const observer=new ResizeObserver(()=>draw());for(const chart of Object.values(charts))observer.observe(chart);
  window.addEventListener('openai:set_globals',event=>{if(event.detail?.globals?.widgetState){applySaved(event.detail.globals.widgetState);draw();}});
  window.FlowStrengthPreview={buildChart,markStyle,capacityForWidth,statistics,data,getModels:()=>lastModels,getState:()=>({...state})};
})();
</script>
