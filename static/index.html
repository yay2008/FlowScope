<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowScope</title>
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="favicon.svg" type="image/svg+xml" sizes="any">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="toolbar">
  <span class="logo">FlowScope</span>
  <div id="picker" class="picker">
    <button id="picker-trigger" class="picker-trigger" aria-haspopup="listbox" aria-expanded="false"
            title="选择品种与月份：输入即搜索（中文名/代码），↑↓ 移动，→/← 换列，Tab 切换期货/加密，Enter 确认，Esc 关闭；双击品种 = 主力。切换合约只走这里。">选择合约</button>
    <div id="picker-popup" class="picker-popup" hidden>
      <div class="picker-search-bar">
        <input id="picker-search" type="text" placeholder="搜索品种 / 代码，如 燃油、fu、rb" spellcheck="false" autocomplete="off">
      </div>
      <div id="picker-tabs" class="picker-tabs" role="tablist" aria-label="分类" hidden></div>
      <div class="picker-columns">
        <div id="picker-products" class="picker-col" role="listbox" aria-label="品种"></div>
        <div id="picker-months" class="picker-col" role="listbox" aria-label="月份"></div>
      </div>
      <div id="picker-foot" class="picker-foot">↑↓ 移动 · →/← 换列 · Tab 换分类 · Enter 确认 · Esc 关闭 · 双击品种=主力 · ☆ 加自选</div>
    </div>
  </div>
  <label>视图
    <select id="view">
      <option value="candle" selected>K线</option>
      <option value="footprint">足迹图</option>
    </select>
  </label>
  <!-- 模式/阈值在每张图 FlowMeter 窗格的左上角(chart-view.js 建), 只影响那个窗格 -->
  <label>买卖口径
    <select id="cvd-source" title="决定成交量怎么分成主动买和主动卖，影响 CVD、Delta 和买卖量。TqSdk tick：按快照盘口估算方向；TV K线：按小周期 K 线涨跌归类成交量，后面的秒数是拆分用的小周期，当前周期用不了的置灰。两者行情均来自 TqSdk。">
      <option value="tick" selected>TqSdk tick</option>
      <option value="kline-1">TV K线 1s</option>
      <option value="kline-5">TV K线 5s</option>
      <option value="kline-10">TV K线 10s</option>
      <option value="kline-15">TV K线 15s</option>
      <option value="kline-30">TV K线 30s（粗略）</option>
    </select>
  </label>
  <span class="ai-group">
    <button id="ai-run" type="button" title="把图表截图连同这段行情的数值交给 DeepSeek 分析，结果显示在图表上方的浮层里，并存到 data/analysis/。默认只发鼠标所在的那张图。">AI 分析</button>
    <label title="勾上后两张图一起发给 AI（大周期在前：先定方向再找位置）；两张图周期相同时只发鼠标所在的那张"><input id="ai-both" type="checkbox">双图</label>
  </span>
  <!-- 状态点: 两张图的连接状态 + 合约目录/自选的提示, 细节在悬停提示里(app.js 的 showStatus) -->
  <span id="status" class="off">连接中…</span>
</div>
<div id="workspace">
  <aside id="watchlist">
    <div id="watch-head">
      <span>自选</span>
      <button id="watch-toggle" title="折叠/展开自选面板">‹</button>
    </div>
    <div id="watch-hint">加载中…</div>
    <ul id="watch-items"></ul>
  </aside>
  <!-- 10s、30s 两张图由 chart-view.js 在这里创建, 左右并排 -->
  <div id="chart">
    <!-- AI 看图分析的浮层(ai-panel.js): 盖在图表上, 标题栏拖动、右下角拉大小 -->
    <div id="ai-panel" class="ai-panel" hidden>
      <div id="ai-head" class="ai-head">
        <span id="ai-title" class="ai-title">AI 分析</span>
        <span id="ai-status" class="ai-status"></span>
        <button id="ai-stop" type="button" title="停止这次分析；已经输出的部分照样存盘" hidden>停止</button>
        <button id="ai-again" type="button" title="按当前画面重新截图分析" hidden>重新分析</button>
        <button id="ai-close" type="button" class="ai-close" title="关闭（进行中的分析会停止）">×</button>
      </div>
      <div id="ai-body" class="ai-body">
        <div id="ai-shots" class="ai-shots"></div>
        <details id="ai-thinking" class="ai-thinking" hidden>
          <summary id="ai-thinking-summary">思考过程</summary>
          <div id="ai-thinking-text" class="ai-thinking-text"></div>
        </details>
        <div id="ai-text" class="ai-text"></div>
        <div id="ai-error" class="ai-error"></div>
      </div>
      <div id="ai-foot" class="ai-foot"></div>
    </div>
  </div>
  <aside id="trade">
    <div id="trade-head">
      <button id="trade-toggle" title="折叠/展开模拟交易面板">›</button>
      <span>模拟交易</span>
    </div>
    <div id="trade-body">
      <div id="trade-contract">加载中…</div>
      <div class="trade-book">
        <span class="trade-dim">卖一</span><span id="trade-ask">—</span><span id="trade-ask-vol" class="trade-dim"></span>
        <span class="trade-dim">买一</span><span id="trade-bid">—</span><span id="trade-bid-vol" class="trade-dim"></span>
      </div>
      <div class="trade-form">
        <label><span id="trade-qty-label">手数</span><input id="trade-qty" type="number" min="1" max="500" step="1" value="1"></label>
        <label>类型<select id="trade-type">
          <option value="market" selected>市价</option>
          <option value="limit">限价</option>
        </select></label>
        <label id="trade-price-row" hidden>价格<input id="trade-price" type="number" min="0" step="any"></label>
        <label id="trade-leverage-row" hidden title="加密合约每个合约一个杠杆(全仓); 降杠杆后保证金不够会被拒">杠杆<select id="trade-leverage"></select></label>
        <div class="trade-order-stops" title="可选, 留空表示不设。成交后挂到持仓上(只覆盖填了的那一项), 按最新价触发后市价平掉全部持仓。市价单按最新价校验, 限价单按委托价校验; 只减仓、平仓的委托不能带。下单成功后清空">
          <label>止盈<input id="trade-order-tp" type="number" min="0" step="any" placeholder="不设"></label>
          <label>止损<input id="trade-order-sl" type="number" min="0" step="any" placeholder="不设"></label>
        </div>
      </div>
      <div class="trade-actions">
        <button id="trade-buy" class="trade-buy" title="市价: 按卖一价整笔成交; 限价: 卖一不高于限价就立即成交, 否则挂单">买入</button>
        <button id="trade-sell" class="trade-sell" title="市价: 按买一价整笔成交; 限价: 买一不低于限价就立即成交, 否则挂单">卖出</button>
      </div>
      <button id="trade-flatten" class="trade-flatten" title="按市价平掉当前合约的全部持仓">平仓</button>
      <div id="trade-msg" class="trade-msg"></div>
      <div class="trade-section">持仓</div>
      <div id="trade-position" class="trade-grid"></div>
      <div id="trade-stops" class="trade-stops" hidden title="按最新价触发: 多单最新价涨到止盈价或跌到止损价(空单反之)就按市价平掉全部持仓; 留空表示不设。也可以在 K 线上划线: 拖止盈/止损线改价, 从持仓均价线拖出新设, 双击线取消">
        <label>止盈<input id="trade-tp" type="number" min="0" step="any" placeholder="不设"></label>
        <label>止损<input id="trade-sl" type="number" min="0" step="any" placeholder="不设"></label>
        <button id="trade-stops-set">设置止盈止损</button>
        <div id="trade-stops-note" class="trade-stops-note"></div>
      </div>
      <div class="trade-section">账户</div>
      <div id="trade-account" class="trade-grid"></div>
      <div class="trade-section">委托</div>
      <ul id="trade-orders" class="trade-list"></ul>
      <div class="trade-section">成交</div>
      <ul id="trade-trades" class="trade-list"></ul>
      <div class="trade-foot">
        <span id="trade-note"></span>
        <button id="trade-reset" title="清空持仓、委托与成交, 以新的初始资金重新开始">重置账户</button>
      </div>
    </div>
  </aside>
</div>
<script src="vendor/lightweight-charts.standalone.production.js"></script>
<script>window.LightweightCharts || document.write('<script src="https://unpkg.com/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"><\/script>')</script>
<script src="data-sync.js"></script>
<script src="indicators.js"></script>
<script src="picker-core.js"></script>
<script src="contract-picker.js"></script>
<script src="paper-panel.js"></script>
<script src="ai-panel.js"></script>
<script src="chart-view.js"></script>
<script src="app.js"></script>
</body>
</html>
