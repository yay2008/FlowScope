<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlowScope · 30s</title>
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="favicon.svg" type="image/svg+xml" sizes="any">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="toolbar">
  <span class="logo">FlowScope</span>
  <div id="picker" class="picker">
    <button id="picker-trigger" class="picker-trigger" aria-haspopup="listbox" aria-expanded="false"
            title="选择品种与月份：输入即搜索（中文名/代码），↑↓ 移动，→/← 换列，Enter 确认，Esc 关闭；双击品种 = 主力。切换合约只走这里。">选择合约</button>
    <div id="picker-popup" class="picker-popup" hidden>
      <div class="picker-search-bar">
        <input id="picker-search" type="text" placeholder="搜索品种 / 代码，如 燃油、fu、rb" spellcheck="false" autocomplete="off">
      </div>
      <div class="picker-columns">
        <div id="picker-products" class="picker-col" role="listbox" aria-label="品种"></div>
        <div id="picker-months" class="picker-col" role="listbox" aria-label="月份"></div>
      </div>
      <div id="picker-foot" class="picker-foot">↑↓ 移动 · →/← 换列 · Enter 确认 · Esc 关闭 · 双击品种=主力 · ☆ 加自选</div>
    </div>
  </div>
  <span id="symbol-name" spellcheck="false">加载中…</span>
  <label>周期
    <select id="tf" title="主图周期。切换后 K 线、成交量、足迹图、CVD 全部按该周期重算；指标长度按根数保持不变（与 TradingView 切周期行为一致），所以 10s 下 300 根均线覆盖的时长是 30s 的 1/3。">
      <option value="10">10s</option>
      <option value="30" selected>30s</option>
    </select>
  </label>
  <label>视图
    <select id="view">
      <option value="candle" selected>K线</option>
      <option value="footprint">足迹图</option>
    </select>
  </label>
  <label>叠加
    <select id="lw-overlay" title="把 FlowWave 的回归通道叠加到主图(不影响副图): 中线 = 收盘价线性回归 21 根, 上下轨 = 中线 ±k 倍回归残差标准差(k 由右边的「带宽」选); wt2 超买(大于80)段染红、超卖(小于20)段染绿, 首次越界处在上/下轨打点。轨道是真实价格, 可当动态支撑压力看。">
      <option value="off" selected>关</option>
      <option value="on">FlowWave带</option>
    </select>
  </label>
  <label>带宽
    <select id="band-k" title="叠加带的带宽倍数 k: 上下轨 = 中线 ±k 倍回归残差标准差。实测 800 根 fu 30s 的收盘包含率: 1.5σ 81.1% / 2σ 91.0% / 2.5σ 96.6%。越窄触碰信号越多但假信号也越多, 越宽越少被穿。只在「叠加」打开时可调。" disabled>
      <option value="1.5">1.5σ</option>
      <option value="2" selected>2σ</option>
      <option value="2.5">2.5σ</option>
    </select>
  </label>
  <label>模式
    <select id="mode">
      <option value="rvol">Relative Volume</option>
      <option value="crvol">CRVOL</option>
      <option value="volume">Volume</option>
      <option value="bsv">Buy/Sell Volume</option>
      <option value="delta">Volume Delta</option>
      <option value="cvd" selected>CVD</option>
    </select>
  </label>
  <label>阈值
    <select id="threshtype">
      <option value="RELATIVE">RELATIVE</option>
      <option value="SMA">SMA</option>
      <option value="Z-SCORE" selected>Z-SCORE</option>
    </select>
  </label>
  <label>CVD口径
    <select id="cvd-source" title="TV K线口径按小周期K线涨跌归类成交量；TqSdk tick口径按快照盘口估算方向。两者行情均来自TqSdk，也影响Delta和买卖量。">
      <option value="tick" selected>TqSdk tick口径</option>
      <option value="kline">TV K线口径</option>
    </select>
  </label>
  <label>拆分粒度
    <select id="ltf" disabled title="仅TV K线口径使用；tick口径不使用小周期。">
      <option value="1">1s</option>
      <option value="5">5s</option>
      <option value="10" selected>10s</option>
      <option value="15">15s</option>
      <option value="30">30s(粗略)</option>
    </select>
  </label>
  <span id="status" class="off">连接中…</span>
  <span id="picker-hint" title=""></span>
  <span id="coverage" title="完整表示快照区间量与K线成交量核对一致。CVD累计可用的快照估算和历史回填量；缺失留空，部分覆盖和旧历史仍保留标记。">覆盖:待加载</span>
  <span id="legend"></span>
</div>
<div id="workspace">
  <aside id="watchlist">
    <div id="watch-head">
      <span>自选</span>
      <button id="watch-toggle" title="折叠/展开自选面板">‹</button>
    </div>
    <div id="watch-hint">加载中…</div>
    <ul id="watch-items"></ul>
  </aside>
  <div id="chart"></div>
</div>
<script src="vendor/lightweight-charts.standalone.production.js"></script>
<script>window.LightweightCharts || document.write('<script src="https://unpkg.com/lightweight-charts@5.2.1/dist/lightweight-charts.standalone.production.js"><\/script>')</script>
<script src="data-sync.js"></script>
<script src="picker-core.js"></script>
<script src="contract-picker.js"></script>
<script src="app.js"></script>
</body>
</html>
